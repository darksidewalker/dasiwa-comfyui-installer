name: Upload Binaries to Release

on:
  push:
    branches: [main]
    paths:
      - 'dasiwa-installer-linux-amd64'
      - 'dasiwa-installer-windows-amd64.exe'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to get release ID; if it truly doesn't exist, create it
          rel_id=$(gh release view latest --json id --jq '.id' 2>/dev/null || true)
          if [ -z "$rel_id" ]; then
            echo "No release for 'latest' tag found. Creating..."
            # Use API directly — gh release create fails when tag exists without release
            http_post="method=POST"
            http_body="{\"tag_name\":\"latest\",\"name\":\"latest\",\"body\":\"Auto-managed release for latest binaries\",\"make_latest\":true,\"prerelease\":true}"
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "$http_body" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              || echo "Release creation skipped (may already exist)"
          else
            echo "Release 'latest' exists (id=$rel_id)."
          fi

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove old assets with matching names
          for asset in dasiwa-installer-linux-amd64 dasiwa-installer-windows-amd64.exe; do
            gh release delete-assets latest "$asset" --yes 2>/dev/null || true
          done

          # Upload new ones (only if present)
          [[ -f dasiwa-installer-linux-amd64 ]] && \
            gh release upload latest dasiwa-installer-linux-amd64 --clobber
          [[ -f dasiwa-installer-windows-amd64.exe ]] && \
            gh release upload latest dasiwa-installer-windows-amd64.exe --clobber
